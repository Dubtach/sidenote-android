name: Build SideNote Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # This project uses a checksum-verifying bootstrap script instead of a standard wrapper JAR.
          validate-wrappers: false

      - name: Check Google OAuth configuration
        shell: bash
        env:
          SIDENOTE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SIDENOTE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$SIDENOTE_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::Google sign-in is not configured. Add repository secret SIDENOTE_GOOGLE_WEB_CLIENT_ID containing your Firebase project's OAuth client ID of type Web application. Email/password sign-in can still work."
          else
            echo "Google Web OAuth client ID secret is present."
          fi

      - name: Build APK
        env:
          SIDENOTE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SIDENOTE_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK and print Google sign-in fingerprint
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "SHA fingerprints for this APK (register SHA-1 in Firebase Android app settings):"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/sidenote-apk-certs.txt
          grep -E 'certificate SHA-1 digest|certificate SHA-256 digest' /tmp/sidenote-apk-certs.txt || true
          echo "Note: GitHub-hosted runners create a fresh debug signing key for each run unless you configure stable signing."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SideNote-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
