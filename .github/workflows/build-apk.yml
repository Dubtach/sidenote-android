name: Build SideNote Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # This project uses a checksum-verifying bootstrap script instead of a standard wrapper JAR.
          validate-wrappers: false

      - name: Configure native Firebase Android app
        shell: bash
        env:
          SIDENOTE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.SIDENOTE_GOOGLE_SERVICES_JSON_BASE64 }}
          SIDENOTE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SIDENOTE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$SIDENOTE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing SIDENOTE_GOOGLE_SERVICES_JSON_BASE64. Register com.dubtach.sidenote as an Android app in Firebase, download google-services.json, base64-encode it, and save it as this GitHub Actions secret. See ANDROID_SETUP.md."
            exit 1
          fi
          mkdir -p app
          echo "$SIDENOTE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python - <<'PYJSON'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('app/google-services.json').read_text())
          android_clients = [c for c in data.get('client', []) if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.dubtach.sidenote']
          if not android_clients:
              raise SystemExit('google-services.json does not contain Android package com.dubtach.sidenote')
          if data.get('project_info', {}).get('project_id') != 'notebeedubtach':
              raise SystemExit('google-services.json belongs to a different Firebase project; expected notebeedubtach')
          selected = android_clients[0]
          if not selected.get('client_info', {}).get('mobilesdk_app_id') or not selected.get('api_key'):
              raise SystemExit('google-services.json is missing the Android Firebase app ID or API key. Download it again from Firebase Project settings.')
          web_client_id = os.environ.get('SIDENOTE_GOOGLE_WEB_CLIENT_ID', '').strip()
          embedded_web_ids = set()
          for oauth in selected.get('oauth_client', []):
              if str(oauth.get('client_type')) == '3' and oauth.get('client_id'):
                  embedded_web_ids.add(oauth['client_id'].strip())
          for oauth in selected.get('services', {}).get('appinvite_service', {}).get('other_platform_oauth_client', []):
              if str(oauth.get('client_type')) == '3' and oauth.get('client_id'):
                  embedded_web_ids.add(oauth['client_id'].strip())
          if not web_client_id:
              raise SystemExit('Missing SIDENOTE_GOOGLE_WEB_CLIENT_ID. Set the Web application OAuth client ID in GitHub Actions secrets.')
          if web_client_id not in embedded_web_ids:
              raise SystemExit('SIDENOTE_GOOGLE_WEB_CLIENT_ID does not match a Web OAuth client inside google-services.json. In Firebase, enable Google sign-in, register this Android app SHA-1/SHA-256, download a fresh google-services.json, then update both GitHub secrets.')
          print('Firebase Android config and matching Web OAuth client validated for notebeedubtach / com.dubtach.sidenote.')
          PYJSON
          if [ -z "$SIDENOTE_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Missing SIDENOTE_GOOGLE_WEB_CLIENT_ID. Add the OAuth client ID with type Web application to GitHub Actions secrets; Google sign-in will not work without it. See ANDROID_SETUP.md."
            exit 1
          fi
          if [[ ! "$SIDENOTE_GOOGLE_WEB_CLIENT_ID" =~ \.apps\.googleusercontent\.com$ ]]; then
            echo "::error::SIDENOTE_GOOGLE_WEB_CLIENT_ID is not a valid Google OAuth client ID. Use the Web application client, not the Android or Chrome Extension client."
            exit 1
          fi
          echo "Firebase Android config and matching Web OAuth client ID validated."

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sidenote-debug-signing-v1

      - name: Ensure debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=SideNote,C=BD"
          fi

      - name: Run note lifecycle and sync tests
        run: node --test tests/side-note-features.test.cjs

      - name: Build APK
        env:
          SIDENOTE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SIDENOTE_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK and print Google sign-in fingerprint
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "SHA fingerprints for this APK (register SHA-1 in Firebase Android app settings):"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/sidenote-apk-certs.txt
          grep -E 'certificate SHA-1 digest|certificate SHA-256 digest' /tmp/sidenote-apk-certs.txt || true
          echo "The debug signing key is cached between builds to keep the APK signature stable. Register this SHA-1 in Firebase → Project settings → Android app."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SideNote-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
